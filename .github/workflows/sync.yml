name: Auto Sync from Upstream

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with upstream
        uses: actions/checkout@v4
        with:
          repository: Leonxlnx/earshot
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: Push to fork
        run: |
          git config user.name "ZHOUYU86"
          git config user.email "863904696@qq.com"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/ZHOUYU86/earshot.git HEAD:main --force